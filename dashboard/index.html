<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fff5f7">
<title>부업 비서실 · 엠또의 먹고 사는 법</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#fff7f6; --bg2:#f4f1ff;
  --card:#ffffff; --card-2:#fdfbfb;
  --ink:#241d29; --ink-2:#5d5568; --ink-3:#8e8698;
  --line:#efe6ee; --line-2:#e6dcea;
  --pink:#e8608f; --pink-2:#f7b8cd; --pink-soft:#ffeef4;
  --lav:#7a62d8; --lav-soft:#f0ecff;
  --mint:#1f9c7b; --mint-soft:#e6f7f1;
  --amber:#c07a13; --amber-soft:#fff4e0;
  --shadow:0 1px 2px rgba(70,40,70,.05),0 10px 26px -12px rgba(70,40,70,.22);
  --radius:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17141c; --bg2:#1b1724;
    --card:#211c29; --card-2:#262030;
    --ink:#f2edf5; --ink-2:#bdb4c8; --ink-3:#8d849a;
    --line:#322a3d; --line-2:#3c3348;
    --pink:#ff8fb4; --pink-2:#7d3f57; --pink-soft:#2e2130;
    --lav:#b9a6ff; --lav-soft:#282138;
    --mint:#5fd3b0; --mint-soft:#1b2f2a;
    --amber:#f0b45e; --amber-soft:#332a1c;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 500px at 8% -8%, var(--pink-soft), transparent 62%),
    radial-gradient(800px 460px at 96% 4%, var(--lav-soft), transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
}
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 56px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
a{color:var(--pink);text-decoration:none}
a:hover{text-decoration:underline}

/* ── hero ── */
.hero{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--lav);background:var(--lav-soft);border-radius:999px;padding:5px 11px}
h1{font-size:clamp(24px,6vw,32px);line-height:1.2;margin:2px 0 0;letter-spacing:-.035em}
h1 .sub{display:block;font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em;margin-top:6px}
.meta{font-size:12.5px;color:var(--ink-3)}

/* ── section ── */
section{margin-top:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 11px}
.sec-head h2{font-size:15.5px;margin:0;letter-spacing:-.02em}
.sec-head .hint{font-size:12px;color:var(--ink-3)}

/* ── routines ── */
.routines{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:680px){.routines{grid-template-columns:repeat(3,1fr)}}
.routine{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 15px 14px;box-shadow:var(--shadow);overflow:hidden}
.routine::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--pink),var(--lav))}
.routine .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.routine .nm{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px}
.routine .ic{font-size:17px;line-height:1}
.routine .time{margin-top:8px;font-size:19px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.routine .time small{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.routine .desc{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.routine .hand{font-size:11.5px;color:var(--ink-3);margin-top:7px}
.state{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--mint);background:var(--mint-soft);border-radius:999px;padding:3px 8px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,156,123,.45)}70%{box-shadow:0 0 0 7px rgba(31,156,123,0)}100%{box-shadow:0 0 0 0 rgba(31,156,123,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:680px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat .lb{font-size:12px;font-weight:700;color:var(--ink-2)}
.stat .vl{margin-top:6px;font-size:clamp(22px,5.4vw,26px);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .vl .u{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-left:2px;letter-spacing:0}
.stat .nt{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.stat.muted .vl{color:var(--ink-3)}
.stat.accent{background:linear-gradient(160deg,var(--pink-soft),var(--card) 70%);border-color:var(--pink-2)}

/* ── highlight ── */
.hl{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow)}
.hl .h-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.hl h3{margin:0;font-size:14.5px;letter-spacing:-.02em}
.badge{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pink),var(--lav));border-radius:999px;padding:4px 10px;white-space:nowrap}
.ranks{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px}
.ranks li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}
.ranks .kw{font-size:12.8px;color:var(--ink-2);line-height:1.35}
.ranks .rk{font-size:12px;font-weight:800;color:var(--pink);white-space:nowrap;background:var(--pink-soft);border-radius:999px;padding:3px 9px}
.hl .nt{margin:11px 0 0;font-size:12.3px;color:var(--ink-3);line-height:1.5}

/* ── posts ── */
.posts{display:grid;gap:10px}
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:12px}
.post .date{font-size:12px;font-weight:800;color:var(--ink-3);padding-top:2px;font-variant-numeric:tabular-nums;min-width:44px}
.post .ttl{font-size:14.5px;font-weight:700;letter-spacing:-.02em;line-height:1.4}
.post .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--card-2);border:1px solid var(--line-2);color:var(--ink-2)}
.pill.done{color:var(--mint);background:var(--mint-soft);border-color:transparent}
.pill.wait{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.post .note{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.5}

/* ── links (copy) ── */
.links-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.links{display:grid;gap:10px}
@media (min-width:680px){.links{grid-template-columns:1fr 1fr}}
.link{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.link .l-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.link .nm{font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.link .kind{font-size:10.5px;font-weight:800;color:var(--lav);background:var(--lav-soft);border-radius:999px;padding:3px 8px;white-space:nowrap}
.link .url{display:block;margin-top:6px;font-size:11.5px;color:var(--ink-3);word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.link .acts{display:flex;gap:7px;margin-top:11px}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);font:inherit;font-size:12px;font-weight:700;border-radius:11px;padding:8px 12px;cursor:pointer;transition:transform .08s ease,background .15s ease,border-color .15s ease;min-height:38px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--pink),#d3558a);border-color:transparent;color:#fff}
.btn:hover{border-color:var(--pink-2)}
.btn.primary:hover{border-color:transparent;filter:brightness(1.03)}
.btn.full{width:100%;margin-top:2px}

/* ── schedule ── */
.sched{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.ev .d{font-size:12.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:1px}
.ev .t{font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.4}
.ev .n{font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.5}
.dday{font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 9px;white-space:nowrap;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line-2)}
.dday.urgent{color:#fff;background:linear-gradient(135deg,#e8608f,#c2417a);border-color:transparent}
.dday.past{color:var(--ink-3)}

/* ── notice / footer ── */
.notice{margin-top:26px;font-size:11.8px;line-height:1.6;color:var(--ink-3);background:var(--card-2);border:1px dashed var(--line-2);border-radius:14px;padding:12px 14px}
.foot{margin-top:18px;text-align:center;font-size:11.5px;color:var(--ink-3);line-height:1.7}
.skel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;color:var(--ink-3);font-size:13px}
.err{background:var(--card);border:1px solid var(--pink-2);border-radius:var(--radius);padding:16px;font-size:13px;color:var(--ink-2)}

/* ── toast ── */
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;pointer-events:none;background:#241d29;color:#fff;font-size:12.8px;font-weight:700;padding:11px 16px;border-radius:999px;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);transition:opacity .18s ease,transform .18s ease;z-index:99;max-width:86vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">🌷 side income desk</span>
    <h1>부업 비서실<span class="sub" id="channel">엠또의 먹고 사는 법</span></h1>
    <div class="meta" id="updated">불러오는 중…</div>
  </header>

  <main id="app">
    <div class="skel">대시보드를 불러오는 중입니다…</div>
  </main>

  <p class="notice" id="notice"></p>
  <div class="foot" id="foot"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var fmtNum = function(s){ return s == null ? '' : String(s); };
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove('on'); }, 1800);
  }
  function copy(text, label){
    var done = function(){ toast(label || '복사했어요!'); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
    } else { fallback(text, done); }
  }
  function fallback(text, done){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    try { document.execCommand('copy'); done(); } catch(e){ toast('복사가 막혔어요. 길게 눌러 복사해 주세요.'); }
    document.body.removeChild(ta);
  }
  function dday(dateStr){
    if (!dateStr) return '';
    var p = dateStr.split('-');
    var target = new Date(+p[0], +p[1]-1, +p[2]);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var diff = Math.round((target - today) / 86400000);
    if (isNaN(diff)) return '';
    if (diff === 0) return 'D-DAY';
    return diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff);
  }

  function render(d){
    document.title = (d.title || '부업 비서실') + ' · ' + (d.channel || '');
    if (d.channel) document.getElementById('channel').textContent = d.channel;
    if (d.updated_label) document.getElementById('updated').textContent = d.updated_label + ' · 매일 아침 자동 갱신';
    document.getElementById('notice').textContent = d.notice || '';
    var f = d.footer || {};
    document.getElementById('foot').innerHTML =
      esc(f.source || '') + (f.updated_from ? '<br>' + esc(f.updated_from) : '');

    var h = '';

    /* routines */
    h += '<section><div class="sec-head"><h2>오늘의 루틴</h2><span class="hint">3개 담당 · 매일 자동</span></div><div class="routines">';
    (d.routines || []).forEach(function(r){
      h += '<article class="routine">'
        +  '<div class="top"><span class="nm"><span class="ic">' + esc(r.icon) + '</span>' + esc(r.name) + '</span>'
        +  '<span class="state"><span class="dot"></span>' + esc(r.state || '가동 중') + '</span></div>'
        +  '<div class="time">' + esc((r.time || '').replace('매일 ', '')) + '<small>매일</small></div>'
        +  '<div class="desc">' + esc(r.desc) + '</div>'
        +  '<div class="hand">→ ' + esc(r.hand) + '</div>'
        +  '</article>';
    });
    h += '</div></section>';

    /* stats */
    if (d.stats && d.stats.length){
      h += '<section><div class="sec-head"><h2>실적 현황판</h2><span class="hint">' + esc(d.updated_label || '') + '</span></div><div class="stats">';
      d.stats.forEach(function(s, i){
        h += '<article class="stat' + (s.tone === 'muted' ? ' muted' : '') + (i === 0 ? ' accent' : '') + '">'
          +  '<div class="lb">' + esc(s.label) + '</div>'
          +  '<div class="vl">' + esc(fmtNum(s.value)) + '<span class="u">' + esc(s.unit) + '</span></div>'
          +  '<div class="nt">' + esc(s.note) + '</div>'
          +  '</article>';
      });
      h += '</div></section>';
    }

    /* highlight */
    if (d.highlight){
      var hl = d.highlight;
      h += '<section><div class="hl"><div class="h-top"><h3>' + esc(hl.title) + '</h3>'
        +  (hl.badge ? '<span class="badge">' + esc(hl.badge) + '</span>' : '') + '</div><ul class="ranks">';
      (hl.rows || []).forEach(function(r){
        h += '<li><span class="kw">' + esc(r.keyword) + '</span><span class="rk">' + esc(r.rank) + '</span></li>';
      });
      h += '</ul>' + (hl.note ? '<p class="nt">' + esc(hl.note) + '</p>' : '') + '</div></section>';
    }

    /* posts */
    if (d.posts && d.posts.length){
      h += '<section><div class="sec-head"><h2>블로그 발행 목록</h2><span class="hint">최근 · 대기</span></div><div class="posts">';
      d.posts.forEach(function(p){
        h += '<article class="post"><div class="date">' + esc(p.day) + '</div><div>'
          +  '<div class="ttl">' + esc(p.title) + '</div><div class="row">'
          +  '<span class="pill ' + esc(p.tone || '') + '">' + esc(p.status) + '</span>';
        (p.tags || []).forEach(function(t){ h += '<span class="pill">' + esc(t) + '</span>'; });
        h += '</div>' + (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') + '</div></article>';
      });
      h += '</div></section>';
    }

    /* links */
    if (d.coupang_links && d.coupang_links.length){
      h += '<section><div class="sec-head"><h2>스레드 · 쿠파스 준비함</h2><span class="hint">hijangc1 채널</span></div>'
        +  '<div class="links">';
      d.coupang_links.forEach(function(l, i){
        var block = (d.disclosure ? d.disclosure + '\n' : '') + l.name + '\n' + l.url;
        h += '<article class="link">'
          +  '<div class="l-top"><span class="nm">' + esc(l.name) + '</span><span class="kind">' + esc(l.kind || '쿠파스') + '</span></div>'
          +  '<span class="url">' + esc(l.url) + '</span>'
          +  '<div class="acts">'
          +  '<button class="btn primary" data-copy="' + esc(l.url) + '" data-label="링크 복사했어요!">링크 복사</button>'
          +  '<button class="btn" data-copy="' + esc(block) + '" data-label="안내문구 + 링크 복사했어요!">문구까지</button>'
          +  '</div></article>';
      });
      h += '</div>';
      if (d.disclosure){
        h += '<button class="btn full" data-copy="' + esc(d.disclosure) + '" data-label="대가성 문구 복사했어요!">📋 쿠파스 대가성 문구 복사</button>';
      }
      h += '</section>';
    }

    /* schedule */
    if (d.schedule && d.schedule.length){
      h += '<section><div class="sec-head"><h2>다가오는 체크 일정</h2><span class="hint">놓치면 안 되는 것</span></div><div class="sched">';
      d.schedule.forEach(function(e){
        var dd = dday(e.date);
        var cls = 'dday' + (e.tone === 'urgent' ? ' urgent' : '') + (dd.indexOf('D+') === 0 ? ' past' : '');
        h += '<article class="ev"><div class="d">' + esc(e.day) + '</div>'
          +  '<div><div class="t">' + esc(e.title) + '</div><div class="n">' + esc(e.note) + '</div></div>'
          +  (dd ? '<span class="' + cls + '">' + esc(dd) + '</span>' : '') + '</article>';
      });
      h += '</div></section>';
    }

    document.getElementById('app').innerHTML = h;

    document.getElementById('app').addEventListener('click', function(ev){
      var b = ev.target.closest('[data-copy]');
      if (!b) return;
      copy(b.getAttribute('data-copy'), b.getAttribute('data-label'));
    });
  }

  fetch('./data/dashboard.json', { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function(e){
      document.getElementById('updated').textContent = '데이터를 불러오지 못했어요';
      document.getElementById('app').innerHTML =
        '<div class="err">⚙️ <b>data/dashboard.json</b>을 읽지 못했습니다 (' + esc(e.message) + ').<br>'
        + 'GitHub Pages 주소(<b>/dashboard/</b>)로 열었는지 확인해 주세요. 파일을 직접 열면 브라우저 보안 때문에 데이터를 못 읽습니다.</div>';
    });
})();
</script>
</body>
</html>
