<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>2026 업무 다이어리</title>
<style>body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: spiral-bound work planner. Desk-pink ground, cool white ruled paper, navy rule lines, red/green pen accents. */
:root{
  --desk:#efe1de; --paper:#fbfbfd; --paper-2:#f2f4f9; --ink:#1f2433; --ink-2:#5b6275; --ink-3:#8f95a6;
  --rule:#c9d3ea; --navy:#2c4a8c; --red:#cf3b33; --green:#2d7a4c; --line:#e3e6ef; --shadow:0 1px 2px rgba(40,30,40,.08),0 8px 24px rgba(40,30,40,.08);
  --c-ops:#2c4a8c; --c-pay:#2d7a4c; --c-meet:#7a4fb0; --c-me:#c4517a; --c-note:#c77a1c; --c-none:#8f95a6;
  --off-bg:#fde9e7; --today:#fff4c7; --c-leave:#13807f; --leave-bg:#e2f3f1; --st-prog-bg:#dcf2e3; --st-done-bg:#fbe1ec; --who-bg:91%; --who-fg:32%; --who-bd:82%; --day-sep:#8d9dc2;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-head:"Gowun Batang","Nanum Myeongjo",serif;
  --f-hand:var(--f-ui);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#1b1a20; --paper:#24262e; --paper-2:#2b2e38; --ink:#e8eaf1; --ink-2:#aeb4c4; --ink-3:#7c8395;
  --rule:#3a4560; --navy:#8aa6e6; --red:#ff7b70; --green:#6bc98f; --line:#363a46; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --c-ops:#8aa6e6; --c-pay:#6bc98f; --c-meet:#b996e8; --c-me:#f08db0; --c-note:#f0b260; --c-none:#7c8395;
  --off-bg:#3d2626; --today:#3d3820; --c-leave:#62cfc6; --leave-bg:#1d3634; --st-prog-bg:#1f3a2a; --st-done-bg:#43263a; --who-bg:24%; --who-fg:82%; --who-bd:34%; --day-sep:#56658c; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#1b1a20; --paper:#24262e; --paper-2:#2b2e38; --ink:#e8eaf1; --ink-2:#aeb4c4; --ink-3:#7c8395;
  --rule:#3a4560; --navy:#8aa6e6; --red:#ff7b70; --green:#6bc98f; --line:#363a46; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --c-ops:#8aa6e6; --c-pay:#6bc98f; --c-meet:#b996e8; --c-me:#f08db0; --c-note:#f0b260; --c-none:#7c8395;
  --off-bg:#3d2626; --today:#3d3820; --c-leave:#62cfc6; --leave-bg:#1d3634; --st-prog-bg:#1f3a2a; --st-done-bg:#43263a; --who-bg:24%; --who-fg:82%; --who-bd:34%; --day-sep:#56658c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:1180px;margin:0;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* gate */
#gate{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cover{width:min(380px,100%);background:var(--paper);border-radius:14px 22px 22px 14px;box-shadow:var(--shadow);padding:40px 30px 30px 44px;position:relative}
.cover::before{content:"";position:absolute;left:14px;top:18px;bottom:18px;width:8px;background:radial-gradient(circle,var(--ink-3) 3px,transparent 3.5px) 0 0/8px 22px repeat-y;opacity:.6}
.cover h1{font-family:var(--f-head);font-size:28px;margin:0 0 4px}
.cover p{margin:0 0 24px;color:var(--ink-2)}
.cover label{display:block;font-size:12px;letter-spacing:.06em;color:var(--ink-2);margin-bottom:6px}
.cover input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2);font-size:16px;letter-spacing:.2em}
.cover .btn-main{width:100%;margin-top:12px}
.remember{display:flex!important;align-items:center;gap:6px;margin:10px 0 0;font-size:12.5px!important;letter-spacing:0!important}
.linkbtn{border:0;background:transparent;color:var(--ink-3);font-size:12px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.gate-err{color:var(--red);min-height:20px;margin-top:8px;font-size:13px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:var(--f-head);font-size:22px;font-weight:700;margin-right:auto}
.brand small{font-family:var(--f-ui);font-size:12px;color:var(--ink-2);font-weight:400;margin-left:8px}
/* diary index tabs: colored paper dividers sticking up from the page */
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;margin:6px 0 0;padding:0 14px;align-items:flex-end;position:relative;z-index:1}
.tab{--tc:#e9dcc4;flex:none;border:0;background:var(--tc);color:#3b3530;white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.01em;
  padding:8px 16px 9px;margin-top:8px;border-radius:9px 9px 0 0;box-shadow:inset 0 -7px 7px -7px rgba(0,0,0,.22);filter:saturate(.85) brightness(.97);transition:margin .12s,padding .12s}
.tab:hover{margin-top:4px;padding-bottom:13px}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);margin-top:0;padding:11px 18px 12px;filter:none;box-shadow:0 -3px 8px -4px rgba(40,30,40,.18);border-top:5px solid var(--tc)}
.tab[data-tab="month"]{--tc:#f2cf9b}.tab[data-tab="week"]{--tc:#f1b9c1}.tab[data-tab="db"]{--tc:#bcd5f0}.tab[data-tab="stats"]{--tc:#c4e2bd}
.tab[data-tab="progress"]{--tc:#dac9f0}.tab[data-tab="feedback"]{--tc:#f1e19a}.tab[data-tab="leave"]{--tc:#b3ded8}
#view>.sheet:first-child{border-top-left-radius:4px}
#view>.sheet-head:first-child{background:var(--paper);border-radius:4px 14px 0 0;padding:16px 20px 12px;margin-bottom:0!important;box-shadow:var(--shadow)}
#view>.sheet-head:first-child+.week-spread{border-radius:0 0 14px 14px}

/* layout: page on the left, sticky-note wing on the right */
.shell{max-width:1500px;margin:0;padding-left:max(32px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1180px) 280px;gap:28px;align-items:start}
.mainc{min-width:0}
.wing{position:sticky;top:max(16px,env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto;padding:4px 4px 24px;scrollbar-width:thin}
.wing-head{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
.wing-title{font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.08em}
.wing-head .btn-xs{margin-left:auto}
.memos{display:flex;flex-direction:column;gap:16px;align-items:stretch}
@media (max-width:900px){.memos{align-items:start}}
.memo-title{width:100%;border:0;border-bottom:1px dashed currentColor;border-bottom-color:color-mix(in srgb,currentColor 25%,transparent);background:transparent;color:inherit;font-family:var(--f-ui);font-weight:700;font-size:14px;padding:2px 0 5px;margin-bottom:6px}
.memo-title:focus{outline:none;border-bottom-style:solid}
.memo-title::placeholder{color:inherit;opacity:.45;font-weight:600}
.memo.folded{padding-bottom:6px}
.memo.folded .memo-title{border-bottom:0;margin-bottom:0;padding-bottom:0;padding-right:18px;text-overflow:ellipsis}
.memo.folded .memo-title::placeholder{opacity:.75;font-weight:700}
/* dog-ear corner: the fold toggle */
.memo-fold{position:absolute;right:0;bottom:0;width:22px;height:22px;border:0;padding:0;cursor:pointer;background:linear-gradient(135deg,var(--mc) 0 50%,color-mix(in srgb,var(--mc) 72%,#000) 50% 100%);border-radius:0 0 2px 0;box-shadow:-1px -1px 2px rgba(0,0,0,.12);transition:width .15s,height .15s}
.memo-fold::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 0 50%,rgba(255,255,255,.25) 50% 60%,transparent 60%)}
.memo-fold:hover{width:28px;height:28px}
.memo.folded .memo-fold{width:16px;height:16px}
.memo.folded .memo-fold:hover{width:22px;height:22px}
.memo-fold:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.memo{--mc:#fff1a8;position:relative;background:var(--mc);color:var(--mink,#2b2a26);border-radius:2px;padding:26px 12px 14px;box-shadow:0 1px 1px rgba(0,0,0,.08),0 6px 14px -6px rgba(0,0,0,.35);transform:rotate(-.8deg)}
.memo:nth-child(even){transform:rotate(.9deg)}
.memo:nth-child(3n){transform:rotate(-.3deg)}
.memo::before{content:"";position:absolute;top:-8px;left:50%;width:64px;height:18px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.memo-bar{position:absolute;top:5px;left:8px;right:5px;display:flex;align-items:center;gap:4px}
.memo-date{font-size:10.5px;opacity:.6;margin-right:auto;font-variant-numeric:tabular-nums}
.memo-bar{cursor:grab;height:20px}
.memo-bar button{cursor:pointer}
.memo-grip{font-size:12px;opacity:.4;letter-spacing:-1px}
.memo:hover .memo-grip{opacity:.8}
.memo.dragging{opacity:.45}
.memo.drop-above{box-shadow:0 -4px 0 var(--navy),0 6px 14px -6px rgba(0,0,0,.35)}
.memo.drop-below{box-shadow:0 4px 0 var(--navy),0 6px 14px -6px rgba(0,0,0,.35)}
.memo-btn{width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:inherit;opacity:.55;padding:0;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.memo-btn:hover{opacity:1;background:rgba(0,0,0,.08)}
.memo-btn.armed{opacity:1;background:#c0392b;color:#fff;width:auto;padding:0 6px;font-size:11px}
.memo-dot{width:12px;height:12px;border-radius:50%;background:var(--mc);border:1.5px solid currentColor;opacity:.7}
.memo textarea{width:100%;border:0;background:transparent;color:inherit;resize:none;overflow:hidden;font-family:var(--f-ui);font-size:13.5px;line-height:1.6;padding:0;min-height:44px}
.memo textarea:focus{outline:none}
.memo textarea::placeholder{color:inherit;opacity:.45}
.memo-pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px;padding:6px;border-radius:8px;background:rgba(255,255,255,.55)}
.memo-pal button{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(0,0,0,.15);padding:0}
.memo-pal button.on{box-shadow:0 0 0 2px #2b2a26}
.memo-pal label{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#2b2a26;margin-left:auto}
.memo-pal input[type=color]{width:26px;height:22px;border:0;padding:0;background:transparent}
.memo-empty{font-size:12.5px;color:var(--ink-2);border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;line-height:1.6}
@media (max-width:1180px){.shell{grid-template-columns:minmax(0,1fr) 240px;gap:18px}}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.wing{position:static;max-height:none;overflow:visible}.memos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 12px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn-xs{padding:1px 8px;font-size:12px;border-radius:6px;line-height:1.5}
.btn-main{background:var(--navy);color:var(--paper);border-color:var(--navy);font-weight:600;padding:10px 16px;border-radius:10px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-danger{color:var(--red)}
.icon-btn{border:0;background:transparent;color:var(--ink-3);padding:2px 6px;border-radius:6px}
.icon-btn:hover{color:var(--ink);background:var(--paper-2)}
.banner.preview-band{background:var(--today);font-size:13px}
.banner{background:var(--off-bg);color:var(--ink);padding:10px 14px;border-radius:10px;margin-bottom:12px}

.sheet{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.sheet-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sheet-head h2{font-family:var(--f-head);font-size:22px;margin:0;margin-right:auto;text-wrap:balance}
.muted{color:var(--ink-2)} .small{font-size:12px}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.titlenav{display:flex;align-items:center;gap:4px;margin-right:auto;flex-wrap:wrap}
.sheet-head .titlenav h2{margin:0 4px;min-width:0}
.arrow{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:20px;line-height:1;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;padding:0 0 3px}
.arrow:hover{border-color:var(--navy);color:var(--navy)}
.titlenav .btn-xs{margin-left:6px}
.wk-range{font-family:var(--f-ui);font-size:13px;font-weight:400;color:var(--ink-2);margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
select.inp,input.inp,textarea.inp{border:1px solid var(--line);background:var(--paper-2);border-radius:8px;padding:7px 10px;min-width:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* month */
.mstats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--ink-2)}
.mstats b{font-family:var(--f-head);font-size:20px;color:var(--ink);margin-right:3px;font-variant-numeric:tabular-nums}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--navy);min-width:640px}
.cal .dow{font-size:12px;font-weight:600;padding:8px 6px;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.cal .dow:first-child{color:var(--red)} .cal .dow:last-child{color:var(--navy)}
.day{height:116px;position:relative;border-bottom:1px solid var(--rule);border-right:1px solid var(--line);padding:0;text-align:left;background:var(--cellbg,transparent);border-top:0;border-left:0;display:block;min-width:0;--cellbg:var(--paper)}
.dwrap{display:flex;flex-direction:column;gap:3px;padding:5px 5px 6px;height:100%;overflow:hidden;background:inherit;border-radius:0}
.ev.xtra{display:none}
.day{cursor:pointer}
.ev[draggable=true]{cursor:grab}
.ev.dragging{opacity:.4}
.day.drop-target{outline:2px dashed var(--navy);outline-offset:-3px;--cellbg:var(--paper-2)}
.dragmode .day.many:not(:has(.dragging)):hover .dwrap{position:static;box-shadow:none;outline:0;height:100%;overflow:hidden}
.dragmode .day.many:not(:has(.dragging)):hover .ev.xtra{display:none}
.dragmode .day.many:not(:has(.dragging)):hover .more{display:block}
.day.many:hover,.day.many:focus-visible{z-index:6}
.day.many:hover .dwrap,.day.many:focus-visible .dwrap{position:absolute;top:0;left:0;right:0;height:auto;min-height:100%;overflow:visible;background:var(--cellbg);box-shadow:var(--shadow);outline:1px solid var(--navy);border-radius:4px}
.day.many:hover .ev.xtra,.day.many:focus-visible .ev.xtra{display:flex}
.day.many:hover .more,.day.many:focus-visible .more{display:none}
@media (min-width:700px){.cal-scroll{overflow:visible}}
.day:nth-child(7n+7){border-right:0}
.day:hover{--cellbg:var(--paper-2)}
.day .num{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.day.out{opacity:.38}
.day.sun .num,.day.off .num{color:var(--red)} .day.sat .num{color:var(--navy)}
.day.off,.day.off:hover{--cellbg:var(--off-bg)}
.day.today,.day.today:hover{--cellbg:var(--today)}
.day.today .num::after{content:"오늘";font-size:10px;margin-left:5px;color:var(--ink-2);font-weight:400}
.ev{display:flex;align-items:center;gap:4px;font-size:13.5px;line-height:1.35;min-width:0;color:var(--ink)}
.ev .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev.cancel .t{text-decoration:line-through;color:var(--ink-3)}
.ev{border-radius:4px;padding:1px 3px;cursor:pointer}
.ev:hover{box-shadow:0 0 0 1px var(--navy)}
.ev.s-진행중,.kcard.s-진행중{background:var(--st-prog-bg)}
.ev.s-완료,.kcard.s-완료{background:var(--st-done-bg)}
.ev .st{font-size:12px;width:14px;flex:none;text-align:center}
.more{font-size:13px;color:var(--ink-3)}
.day .hol{font-size:11px;color:var(--red);font-weight:600;margin-left:6px}
.day .num{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.tdb{margin-left:auto;font-size:10.5px;font-weight:500;color:var(--ink-2);background:var(--paper-2);border-radius:99px;padding:0 6px;font-variant-numeric:tabular-nums}
.tdb.all{color:var(--green)}
.tdb{cursor:pointer}
.tdb:hover{background:var(--navy);color:var(--paper)}
.lv{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--c-leave);background:var(--leave-bg);border-radius:5px;padding:1px 6px;white-space:nowrap;align-self:flex-start}
.day.leave,.day.leave:hover{--cellbg:var(--leave-bg)}
.day.leave .lv{background:var(--paper)}
.day .num .lv{margin-left:6px;font-weight:600;align-self:center}
.holbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--paper-2);border-radius:10px;padding:10px;margin-bottom:12px}
.holbox .inp{flex:1 1 160px}
.holrow{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)}
.holrow .hname{color:var(--red)}
.rep{border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;margin:4px 0 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.rep legend{font-size:12px;color:var(--ink-2);padding:0 4px}
.rep-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rep-row label.small{flex-direction:row;align-items:center;gap:6px}
.dows{display:flex;gap:4px;flex-wrap:wrap}
.dw{flex-direction:row!important;align-items:center;gap:3px!important;border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:13px!important;color:var(--ink)!important}
.ev .rp{font-size:9px;color:var(--ink-3);flex:none}
.lvdate{border:0;background:transparent;padding:2px 4px;margin-left:-4px;border-radius:5px;color:var(--navy);font-variant-numeric:tabular-nums;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lvdate:hover{background:var(--paper-2);text-decoration-color:var(--navy)}
.lvlist{display:flex;flex-direction:column;gap:2px;margin-top:12px;max-height:240px;overflow:auto}
.lvlist div{display:grid;grid-template-columns:48px 48px 1fr auto;gap:8px;align-items:center;padding:5px 2px;border-bottom:1px solid var(--line);font-size:13px}
.lvmonths{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end}
.lvmonths>div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
.lvbar{height:90px;width:100%;max-width:28px;background:var(--paper-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.lvbar i{display:block;width:100%;background:var(--c-leave);border-radius:5px}
.catrow{display:grid;grid-template-columns:40px 1fr 56px auto;align-items:center;gap:8px;padding:4px 0}
.catrow input[type=color]{width:36px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--paper-2)}
.dayhead .hol{font-size:13px;color:var(--red);font-weight:700;white-space:nowrap}

/* week spread */
.week-spread{display:grid;grid-template-columns:1fr 26px 1fr;background:var(--paper);border-radius:14px;box-shadow:var(--shadow)}
.page{padding:18px 20px 22px;min-width:0}

/* ---------- dates ---------- */
function pd(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ---------- task helpers ---------- */
let ALL=null;

const FREQ={weekly:"매주",biweekly:"격주",monthly:"매월"};
function ruleLabel(r){ const d=r.dows.map(x=>DOW[x]).join("·"); return r.freq==="monthly"?`매월 ${r.nth}째 주 ${d}요일`:`${FREQ[r.freq]} ${d}요일`; }
function ruleHits(r,d){
  if(!r.dows.includes(d.getDay())) return false;
  if(r.freq==="biweekly"){ const w=Math.round((mondayOf(d)-mondayOf(pd(r.start)))/6048e5); return w%2===0; }
  if(r.freq==="monthly") return Math.ceil(d.getDate()/7)===Number(r.nth);
  return true;
}
function expandRules(){
  const out=[], today=todayStr();
  (S.rules||[]).forEach(r=>{
    const end=r.until||ymd(addDays(new Date(),180));
    let n=0;
    for(let d=pd(r.start); ymd(d)<=end && n<800; d=addDays(d,1), n++){
      const ds=ymd(d); if(!ruleHits(r,d)) continue;
      const ov=(r.overrides||{})[ds]||{};
      if(ov.skip || (r.skipHol!==false && holName(ds))) continue;
      out.push({id:`r~${r.id}~${ds}`,rec:r.id,name:ov.name||r.name,start:ds,end:ov.end||"",time:ov.time??r.time??"",owner:ov.owner??r.owner??"",cat:ov.cat??r.cat??"",place:ov.place??r.place??"",status:ov.status||(ds<today?"완료":"예정"),hist:!!ov.hist,...(ov.desc?{desc:ov.desc}:{})});
    }
  });
  return out;
}
function saveRules(){ ALL=null; persist("settings","recurring",{rules:S.rules}); }
function ruleOf(id){ return (S.rules||[]).find(r=>r.id===id); }
function kindOf(t){ const m=/^\s*\[([^\]]+)\]/.exec(t.name); if(m){ const k=m[1].trim(); return KINDS.includes(k)?k:"기타"; } return isOff(t)?"휴무":"기타"; }
function isOff(t){ return /공휴일|연차|반차|휴가/.test(t.name); }
function holName(ds){ return S.holidays[ds] || ""; }
function leaveOn(ds){ return S.leave.uses[ds] || null; }
function saveLeave(){ persist("settings","leave",S.leave); }
function fd(n){ return (Math.round(n*100)/100).toString(); }
function leaveSum(year){
  const g=S.leave.grants.filter(x=>(x.date||"").startsWith(year)).reduce((a,x)=>a+Number(x.days||0),0);
  const uses=Object.entries(S.leave.uses).filter(([k])=>k.startsWith(year));
  const today=todayStr();
  const used=uses.filter(([k])=>k<=today).reduce((a,[,v])=>a+Number(v.days||0),0);
  const planned=uses.filter(([k])=>k>today).reduce((a,[,v])=>a+Number(v.days||0),0);
  return {g,used,planned,left:g-used-planned,uses};
}
function lvTag(lv){ return `<span class="lv">✈ ${esc(lv.type)}</span>`; }

function covers(t, day){ if(!t.start) return false; const e=t.end||t.start; return t.start<=day && day<=e; }
function bucketOf(t){ return t.start ? t.start.slice(0,7) : "nodate"; }

function inPeriod(t,p){ return p==="all" || (t.start && t.start.startsWith(p)); }
function months(){ const s=new Set(all().filter(t=>t.start).map(t=>t.start.slice(0,7))); s.add(ym(new Date())); return [...s].sort(); }
function mLabel(k){ const [y,m]=k.split("-"); return Number(m)+"월"; }

/* ---------- persistence ---------- */
const queues = {};
function persist(col,id,data){
  if(!db){ return; }
  const key=col+"/"+id;
  queues[key]=(queues[key]||Promise.resolve()).then(()=>db.collection(col).doc(id).set(data)).catch(e=>toast("저장하지 못했어요 ("+(e&&e.code||"오류")+"). 잠시 후 다시 시도해 주세요."));
  return queues[key];
}
function saveBucket(b){ const items=(S.tasks[b]?.items)||[]; items.sort((a,c)=>(a.start+a.time).localeCompare(c.start+c.time)); persist("tasks",b,{items}); }
function upsertTask(t){
  ALL=null;
  if(t.rec){ const r=ruleOf(t.rec); if(r){
      const orig=t.id.split("~")[2];
      if(t.start && t.start!==orig){ // moved to another day: drop this occurrence and keep it as a normal task
        (r.overrides ||= {})[orig]={skip:true}; saveRules();
        const n={...t,id:"t"+Date.now().toString(36)}; delete n.rec; return upsertTask(n); }
      const ov={...((r.overrides ||= {})[orig]||{}),status:t.status,time:t.time||"",place:t.place||"",name:t.name,cat:t.cat||"",owner:t.owner||"",hist:!!t.hist};
      if(t.end) ov.end=t.end; else delete ov.end;
      if(t.desc) ov.desc=t.desc; else delete ov.desc;
      r.overrides[orig]=ov; saveRules(); } return t.id; }
  let oldB=null;
  for(const [b,v] of Object.entries(S.tasks)){ const i=(v.items||[]).findIndex(x=>x.id===t.id); if(i>=0){ oldB=b; v.items.splice(i,1); } }
  const nb=bucketOf(t); (S.tasks[nb] ||= {items:[]}).items.push(t);
  saveBucket(nb); if(oldB && oldB!==nb) saveBucket(oldB);
  return t.id;
}
function deleteTask(id){ ALL=null; for(const [b,v] of Object.entries(S.tasks)){ const i=(v.items||[]).findIndex(x=>x.id===id); if(i>=0){ v.items.splice(i,1); saveBucket(b); } } }
function weekKey(){ return ymd(S.weekStart); }

/* ---------- toast ---------- */
let tT=null;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(tT); tT=setTimeout(()=>el.hidden=true,2600); }

/* ---------- gate ---------- */
function sha256js(str){
  const K=[],H=[]; let n=2,c=0; const isP=x=>{for(let i=2;i*i<=x;i++) if(x%i===0) return false; return true;};
  const frac=x=>((x-Math.floor(x))*4294967296)|0;
  while(c<64){ if(isP(n)){ if(c<8) H[c]=frac(Math.pow(n,1/2)); K[c]=frac(Math.pow(n,1/3)); c++; } n++; }
  const b=[...new TextEncoder().encode(str)], l=b.length*8; b.push(0x80); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push(i>3?0:(l>>>(i*8))&255);
  const r=(x,y)=>(x>>>y)|(x<<(32-y)), w=new Array(64);
  for(let o=0;o<b.length;o+=64){
    for(let i=0;i<16;i++) w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){ const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let [a,bb,cc,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0; h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0; }
    [a,bb,cc,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)|0);
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("");
}
async function sha(s){ if(window.crypto&&crypto.subtle){ try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch{} } return sha256js(s); }
/* ---------- Google Sheets 저장소 (Apps Script) ---------- */
const API_URL_BUILTIN = "https://script.google.com/macros/s/AKfycbzTwtHy-PMf9TtovXVLq6mZIRT8BG_fiTInnxudaIXU1gHFSrxxwkkXJddgqvbolDZh9w/exec";   // 배포할 때 Apps Script 웹 앱 주소를 여기 넣으면 기기마다 입력할 필요가 없어요.
const ls={ get:k=>{ try{ return localStorage.getItem(k); }catch{ return null; } }, set:(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch{} } };
const ss={ get:k=>{ try{ return sessionStorage.getItem(k); }catch{ return null; } }, set:(k,v)=>{ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v); }catch{} } };
function apiUrl(){ return API_URL_BUILTIN || ls.get("wd-api") || ""; }
// claude.ai 아티팩트에서 열리면 미리보기 모드: 아티팩트 저장소를 쓰고 구글 시트는 건드리지 않아요.
const PREVIEW=!!(window.claude&&window.claude.use);
async function artifactDB(){
  const d=await window.claude.use("db").catch(()=>null); if(!d) return null;
  return { collection:c=>d.collection(c), pull(){},
    async dump(){ const out={}; for(const c of ["tasks","settings","weeks","feedback"]){ const s=await d.collection(c).get(); s.docs.forEach(x=>{ if(c==="settings"&&x.id==="access") return; (out[c] ||= {})[x.id]=x.data(); }); } return out; },
    async importAll(data){ for(const c of Object.keys(data)) for(const id of Object.keys(data[c])) await d.collection(c).doc(id).set(data[c][id]); } };
}
let CODE=null;
async function api(body){
  const url=apiUrl(); if(!url) throw {code:"no_url"};
  let r;
  try{ r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,code:CODE})}); }
  catch(e){ throw {code:"network"}; }
  let j; try{ j=await r.json(); }catch{ throw {code:"bad_response"}; }
  if(!j.ok) throw {code:j.error||"server",message:j.message};
  return j;
}
function SheetDB(){
  let cache={}; const subs=[]; let pending=0, lastPull=0;
  try{ cache=JSON.parse(ls.get("wd-cache")||"{}")||{}; }catch{ cache={}; }
  const keep=()=>ls.set("wd-cache",JSON.stringify(cache));
  const docSnap=(col,id,fromCache)=>{ const d=cache[col]&&cache[col][id]; return {id,exists:!!d,data:()=>d?JSON.parse(JSON.stringify(d)):undefined,metadata:{fromCache,hasPendingWrites:pending>0}}; };
  const colSnap=(col,fromCache)=>{ const ids=Object.keys(cache[col]||{}).sort(); const docs=ids.map(id=>docSnap(col,id,fromCache)); return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache,hasPendingWrites:pending>0}}; };
  const notify=(fromCache,onlyCol)=>subs.forEach(s=>{ if(onlyCol&&s.col!==onlyCol) return; try{ s.next(s.id?docSnap(s.col,s.id,fromCache):colSnap(s.col,fromCache)); }catch(e){ console.error(e); } });
  const state=t=>{ const el=$("#sync-state"); if(el) el.textContent=t; };
  async function pull(){
    if(pending>0) return;
    try{ const j=await api({action:"all"}); if(pending>0) return; cache=j.data||{}; keep(); lastPull=Date.now(); notify(false); state("저장됨 · 구글 시트 동기화"); }
    catch(e){ state(e.code==="network"?"오프라인 · 이 기기에 임시 보관 중":"동기화 오류 ("+e.code+")"); if(e.code==="bad_code") lockOut(); }
  }
  const api_={
    collection(col){ return {
      doc(id){ return {
        get:async()=>docSnap(col,id,true),
        set:async data=>{
          (cache[col] ||= {})[id]=JSON.parse(JSON.stringify(data)); keep(); pending++; notify(true,col); state("저장 중…");
          try{ await api({action:"set",col,id,data}); state("저장됨 · 구글 시트 동기화"); }
          catch(e){ state("저장 실패 · 다시 시도해 주세요"); throw e; }
          finally{ pending--; }
        },
        delete:async()=>{ if(cache[col]) delete cache[col][id]; keep(); pending++; notify(true,col); try{ await api({action:"delete",col,id}); } finally{ pending--; } },
        onSnapshot(next){ const s={col,id,next}; subs.push(s); next(docSnap(col,id,true)); return ()=>subs.splice(subs.indexOf(s),1); }
      }; },
      onSnapshot(next){ const s={col,next}; subs.push(s); next(colSnap(col,true)); return ()=>subs.splice(subs.indexOf(s),1); }
    }; },
    pull, dump:()=>JSON.parse(JSON.stringify(cache)),
    async importAll(data){ await api({action:"import",data}); await pull(); }
  };
  pull();
  setInterval(()=>{ if(document.visibilityState==="visible"&&Date.now()-lastPull>45000) pull(); },15000);
  window.addEventListener("focus",()=>{ if(Date.now()-lastPull>8000) pull(); });
  return api_;
}
function showApp(){ $("#gate").hidden=true; $("#app").hidden=false; render(); }
function lockOut(msg){ CODE=null; ss.set("wd-code",null); ls.set("wd-code",null); $("#app").hidden=true; $("#gate").hidden=false; $("#gate-err").textContent=msg||"접속코드가 바뀌었거나 맞지 않아요. 다시 입력해 주세요."; }
async function previewCheck(code){
  if(!db) db=await artifactDB();
  let h=DEFAULT_HASH; try{ const s=await db.collection("settings").doc("access").get(); if(s.exists&&s.data().hash) h=s.data().hash; }catch{}
  return (await sha(code))===h;
}
function gateUrlUI(force){ if(PREVIEW){ $("#gate-url-wrap").hidden=true; $("#gate-url-edit").hidden=true; return; } const need=force||!apiUrl(); $("#gate-url-wrap").hidden=!need; $("#gate-url-edit").hidden=need||!!API_URL_BUILTIN; if(need) $("#gate-url").value=ls.get("wd-api")||""; }
$("#gate-url-edit").onclick=()=>gateUrlUI(true);
$("#gate-form").addEventListener("submit", async e=>{
  e.preventDefault();
  if(PREVIEW){ const code=$("#gate-code").value.trim(); if(!code) return;
    if(!(await previewCheck(code))){ $("#gate-err").textContent="접속코드가 맞지 않아요. 다시 입력해 주세요."; return; }
    CODE=code; ss.set("wd-code",code); $("#gate-code").value=""; $("#gate-err").textContent=""; startApp(); return; }
  if(!$("#gate-url-wrap").hidden){ const u=$("#gate-url").value.trim(); if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) return $("#gate-err").textContent="서버 주소는 https://script.google.com/… 으로 시작해야 해요."; ls.set("wd-api",u); }
  const code=$("#gate-code").value.trim(); if(!code) return;
  $("#gate-btn").disabled=true; $("#gate-btn").textContent="확인 중…"; $("#gate-err").textContent="";
  CODE=code;
  try{ await api({action:"ping"}); }
  catch(err){ CODE=null; $("#gate-btn").disabled=false; $("#gate-btn").textContent="다이어리 열기";
    $("#gate-err").textContent=err.code==="bad_code"?"접속코드가 맞지 않아요. 다시 입력해 주세요.":err.code==="network"?"서버에 연결하지 못했어요. 인터넷 연결과 서버 주소를 확인해 주세요.":"서버 응답에 문제가 있어요 ("+err.code+"). 서버 주소를 확인해 주세요.";
    gateUrlUI(err.code!=="bad_code"); return; }
  $("#gate-btn").disabled=false; $("#gate-btn").textContent="다이어리 열기";
  ss.set("wd-code",code); if($("#gate-remember").checked) ls.set("wd-code",code);
  $("#gate-code").value=""; startApp();
});
$("#btn-lock").onclick=()=>{ CODE=null; ss.set("wd-code",null); ls.set("wd-code",null); $("#app").hidden=true; $("#gate").hidden=false; $("#gate-err").textContent=""; $("#gate-code").focus(); };
$("#btn-code").onclick=()=>{
  openDlg(`<h3>접속코드 변경</h3>
   <div class="form"><label class="full">현재 코드<input class="inp" id="c0" type="password"></label>
   <label>새 코드<input class="inp" id="c1" type="password"></label><label>새 코드 확인<input class="inp" id="c2" type="password"></label></div>
   <div class="gate-err" id="cerr"></div>
   <div class="dlg-foot"><button class="btn" data-close>닫기</button><button class="btn btn-main" id="csave">변경하기</button></div>`);
  $("#csave").onclick=async()=>{

function duplicateTask(t){
  const base=(t.name||"").replace(/\s*\(\d+\)$/,"");
  const used=all().map(x=>{ const m=(x.name||"").match(/^(.*?)\s*\((\d+)\)$/); return m&&m[1]===base?Number(m[2]):0; });
  const n={...t,id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:`${base} (${Math.max(0,...used)+1})`};
  delete n.rec; if(!n.desc) delete n.desc;

function rMonth(){
  const y=S.cur.getFullYear(), m=S.cur.getMonth(), key=ym(S.cur);
  const first=new Date(y,m,1), start=addDays(first,-first.getDay());
  const mt=all().filter(t=>t.start && (t.start.startsWith(key) || (t.end && t.start<key+"-32" && t.end>=key+"-01")));
  const work=mt.filter(t=>!isOff(t));
  const cnt=s=>work.filter(t=>t.status===s).length;
  const today=todayStr();
  let cells="";
  for(let i=0;i<42;i++){
    const d=addDays(start,i), ds=ymd(d);
    if(i===35 && d.getMonth()!==m) break;
    const ts=all().filter(t=>covers(t,ds)).sort((a,b)=>(isOff(b)-isOff(a))||(a.time||"").localeCompare(b.time||""));
    const hol=holName(ds), lv=leaveOn(ds), off=ts.some(isOff)||!!hol;
    const cls=["day",d.getMonth()!==m?"out":"",d.getDay()===0?"sun":"",d.getDay()===6?"sat":"",off?"off":"",lv&&!off?"leave":"",ds===today?"today":""].join(" ");
    const wd=(d.getDay()+6)%7, wk=S.weeks[ymd(mondayOf(d))], its=(wd<5&&wk&&wk.days[wd])?wk.days[wd].items.filter(x=>x.s!=="cancel"&&x.t):[];
    const tdone=its.filter(x=>x.s==="done").length;

      else if(e.key==="Tab" && !e.shiftKey && !it.lv && j>0){ e.preventDefault(); it.lv=1; childrenOf(list,j).forEach(k=>list[k].lv=1); redo(j); }
      else if(e.key==="Tab" && e.shiftKey && it.lv){ e.preventDefault(); delete it.lv; redo(j); }
      else if(e.key==="Backspace" && !txt.value && list.length){ e.preventDefault(); list.splice(j,1); redo(Math.max(0,j-1)); }
    };
    const n=row.querySelector('[data-act="note"]'); if(n) n.oninput=e=>{ it.n=e.target.value; saveWeekSoon(); };
    const wb=row.querySelector(".whobtn"), key=di+"-"+j;
    wb._go=()=>{ const p=openWho(wb,it,()=>{ render(); const nb=$(`.trow[data-di="${di}"][data-j="${j}"] .whobtn`); if(nb&&nb._go) nb._go(); }); popState.key=key; p.querySelector("#pop-new").focus(); };
    row.querySelectorAll('[data-act="who"]').forEach(b=>{
      b.onclick=e=>{ e.stopPropagation(); if($("#pop")&&popState&&popState.key===key){ closeWho(); return; } wb._go(); };
      if(b.tagName!=="BUTTON") b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); wb._go(); } };
    });
    const add=row.querySelector('[data-act="addsub"]'); if(add) add.onclick=()=>{ const at=(childrenOf(list,j).slice(-1)[0]??j)+1; list.splice(at,0,{t:"",s:"todo",n:"",lv:1}); redo(at); };
    const ind=row.querySelector('[data-act="in"]'); if(ind) ind.onclick=()=>{ it.lv=1; childrenOf(list,j).forEach(k=>list[k].lv=1); redo(); };
    const out=row.querySelector('[data-act="out"]'); if(out) out.onclick=()=>{ delete it.lv; redo(); };
    row.querySelector('[data-act="del"]').onclick=()=>{ if(!it.lv) childrenOf(list,j).forEach(k=>delete list[k].lv); list.splice(j,1); redo(); };
    row.querySelector('[data-act="todb"]').onclick=()=>{
      const ds=ymd(addDays(S.weekStart,Number(row.dataset.di)));
      taskForm({id:"t"+Date.now().toString(36),name:it.t,start:ds,end:"",time:"",owner:"",cat:"운영",place:"",status:it.s==="done"?"완료":it.s==="cancel"?"취소":"예정",hist:false}, true);
    };
  });
  /* drag & drop to reorder to-dos (within a day or to another day); a parent moves with its sub-items */
  let wdrag=null;
  const clearMarks=()=>$("#view").querySelectorAll(".drop-above,.drop-below,.day-drop").forEach(x=>x.classList.remove("drop-above","drop-below","day-drop"));
  const moveTo=(drag,di2,tgt,below,withKids)=>{
    const src=w.days[drag.di].items, j=drag.j, first=src[j];
    const kids=first.lv?[]:childrenOf(src,j);
    const idxs=withKids?[j,...kids]:[j], block=idxs.map(k=>src[k]);
    if(tgt && block.includes(tgt)) return false;
    if(!withKids && tgt && kids.map(k=>src[k]).includes(tgt)) { /* dropping the parent among its own children: they become top-level anyway */ }
    if(!withKids) kids.forEach(k=>delete src[k].lv);   // children left behind are outdented
    for(let k=idxs.length-1;k>=0;k--) src.splice(idxs[k],1);
    const dest=w.days[di2].items;
    let at=dest.length;
    if(tgt){ const ti=dest.indexOf(tgt); at=below?ti+1+(!tgt.lv&&!first.lv?childrenOf(dest,ti).length:0):ti; }
    dest.splice(at,0,...block);
    if(at===0 && block[0].lv) delete block[0].lv;
    return true;
  };
  // a parent with sub-items asks whether to bring them along
  const doMove=(di2,tgt,below)=>{
    const drag={...wdrag}; wdrag=null;
    const src=w.days[drag.di].items, first=src[drag.j], kids=first&&!first.lv?childrenOf(src,drag.j):[];
    const go=withKids=>{ if(moveTo(drag,di2,tgt,below,withKids)){ saveWeekSoon(); render(); } };
    if(!kids.length) return go(true);
    if(tgt && kids.map(k=>src[k]).includes(tgt)) return;
    openDlg(`<button class="dlg-x" id="mv-x" title="상위만 옮기기" aria-label="상위 할 일만 옮기기">×</button><h3>하위 할 일도 같이 옮길까요?</h3>
     <p class="muted" style="margin:0 0 6px">'${esc(first.t||"할 일")}' 아래에 하위 할 일이 ${kids.length}개 있어요.</p>
     <p class="muted small" style="margin:0">× 를 누르면 상위 할 일만 옮기고, 남은 하위 할 일은 자동으로 내어쓰기돼요.</p>
     <div class="dlg-foot"><button class="btn" id="mv-one">상위만 옮기기</button><button class="btn btn-main" id="mv-all">확인 (같이 옮기기)</button></div>`);
    $("#mv-all").onclick=()=>{ closeDlg(); go(true); };
    $("#mv-one").onclick=$("#mv-x").onclick=()=>{ closeDlg(); go(false); };
    $("#mv-all").focus();
  };
  $("#view").querySelectorAll(".trow").forEach(row=>{
    const di=Number(row.dataset.di), j=Number(row.dataset.j), grip=row.querySelector(".grip");
    grip.onmousedown=()=>{ row.draggable=true; };
    row.onmouseup=()=>{ row.draggable=false; };
    row.ondragstart=e=>{ wdrag={di,j}; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain","todo"); }catch{} row.classList.add("dragging"); };
    row.ondragend=()=>{ row.draggable=false; row.classList.remove("dragging"); clearMarks(); wdrag=null; };
    row.ondragover=e=>{ if(!wdrag) return; e.preventDefault(); e.stopPropagation(); clearMarks(); const r=row.getBoundingClientRect(); row.classList.add(e.clientY>r.top+r.height/2?"drop-below":"drop-above"); };
    row.ondrop=e=>{ if(!wdrag) return; e.preventDefault(); e.stopPropagation(); clearMarks(); const r=row.getBoundingClientRect(), below=e.clientY>r.top+r.height/2;
      doMove(di,w.days[di].items[j],below); };
  });
  $("#view").querySelectorAll(".dayblock").forEach(blk=>{
    const di=Number(blk.dataset.di);
    blk.ondragover=e=>{ if(!wdrag) return; e.preventDefault(); clearMarks(); blk.classList.add("day-drop"); };
    blk.ondragleave=e=>{ if(!blk.contains(e.relatedTarget)) blk.classList.remove("day-drop"); };
    blk.ondrop=e=>{ if(!wdrag) return; e.preventDefault(); clearMarks(); doMove(di,null,true); };
  });
}

function sortable(els,key,list,done){
  let from=null;
  els.forEach(el=>{
    el.draggable=true;
    el.ondragstart=e=>{ from=el.dataset[key]; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",from); }catch{} el.classList.add("dragging"); };
    el.ondragend=()=>{ el.classList.remove("dragging"); els.forEach(x=>x.classList.remove("drop-l","drop-r")); };
    el.ondragover=e=>{ if(from==null) return; e.preventDefault(); const r=el.getBoundingClientRect(), after=e.clientX>r.left+r.width/2; el.classList.toggle("drop-r",after); el.classList.toggle("drop-l",!after); };
    el.ondragleave=()=>el.classList.remove("drop-l","drop-r");
    el.ondrop=e=>{ e.preventDefault(); el.classList.remove("drop-l","drop-r"); const to=el.dataset[key]; if(from==null||from===to){ from=null; return; }
      const arr=list.filter(x=>x!==from), r=el.getBoundingClientRect(), after=e.clientX>r.left+r.width/2, ti=arr.indexOf(to);
      arr.splice(after?ti+1:ti,0,from); from=null; done(arr); };
  });
}

/* 4. stats */
function hbars(list,total){ return list.map(([l,n,c])=>`<div class="hbar"><span>${esc(l)}</span><div class="track"><i style="width:${total?n/total*100:0}%;background:${c}"></i></div><span class="n">${n} · ${total?Math.round(n/total*100):0}%</span></div>`).join(""); }
function rStats(){
  const p=S.statPeriod;
  let ts=all().filter(t=>t.start&&inPeriod(t,p)); if(S.statNoOff) ts=ts.filter(t=>!isOff(t));
  const tot=ts.length, done=ts.filter(t=>t.status==="완료").length, live=ts.filter(t=>t.status!=="취소").length;
  const catList=[...CATS,""].map(c=>[c||"미분류",ts.filter(t=>(t.cat||"")===c).length,CAT_COLOR[c]]).filter(x=>x[1]>0||x[0]!=="미분류");
  const kindList=KINDS.map(k=>[k,ts.filter(t=>kindOf(t)===k).length,"var(--navy)"]);
  const stList=STATUSES.map(s=>[s,ts.filter(t=>t.status===s).length,ST_COLOR[s]]);
  // monthly stacked chart
  const ms=months().filter(k=>k<=ym(new Date())||all().some(t=>t.start&&t.start.startsWith(k)));
  const base=all().filter(t=>t.start&&(!S.statNoOff||!isOff(t)));
  const data=ms.map(k=>({k,v:[...CATS,""].map(c=>base.filter(t=>t.start.startsWith(k)&&(t.cat||"")===c).length)}));
  const max=Math.max(1,...data.map(d=>d.v.reduce((a,b)=>a+b,0)));
  const step=max>30?10:5, top=Math.ceil(max/step)*step;
  const W=640,H=240,L=34,B=26,T=12,bw=(W-L-10)/data.length;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="월별 업무분류 건수">`;
  for(let v=0;v<=top;v+=step){ const y=H-B-(v/top)*(H-B-T); svg+=`<line x1="${L}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v}</text>`; }
  data.forEach((d,i)=>{ let y=H-B; const x=L+i*bw+bw*.2, w=bw*.6; const sum=d.v.reduce((a,b)=>a+b,0);
    d.v.forEach((n,ci)=>{ if(!n) return; const h=n/top*(H-B-T); y-=h; svg+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${CAT_COLOR[[...CATS,""][ci]]}"><title>${mLabel(d.k)} ${[...CATS,"미분류"][ci]} ${n}건</title></rect>`; });
    svg+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" ${d.k===p?'style="font-weight:700;fill:var(--ink)"':""}>${mLabel(d.k)}</text>`;
    if(sum) svg+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" style="fill:var(--ink)">${sum}</text>`; });
  svg+="</svg>";
  $("#view").innerHTML=`<section class="sheet">
   <div class="sheet-head"><h2>분류별 업무 통계</h2>
    <select class="inp" id="sp"><option value="all">전체 기간</option>${months().map(k=>`<option value="${k}" ${p===k?"selected":""}>${k.replace("-","년 ")}월</option>`).join("")}</select>
    <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="snooff" ${S.statNoOff?"checked":""}> 휴무·공휴일 제외</label></div>
   <div class="kpis">
    <div class="kpi"><div class="v">${tot}</div><div class="l">전체 업무</div></div>
    <div class="kpi"><div class="v">${live?Math.round(done/live*100):0}%</div><div class="l">완료율 (취소 제외 ${live}건 중 ${done})</div></div>
    <div class="kpi"><div class="v">${kindList[0][1]}</div><div class="l">지시 업무</div></div>
    <div class="kpi"><div class="v">${ts.filter(t=>t.hist).length}</div><div class="l">히스토리 ★ 핵심업무</div></div>
   </div>
   <div class="grid2">
    <div class="card"><h3>업무분류별</h3>${hbars(catList,tot)}</div>
    <div class="card"><h3>업무 구분별 <span class="muted small">(이름 앞 [지시]·[일반] 기준)</span></h3>${hbars(kindList,tot)}</div>
    <div class="card" style="grid-column:1/-1"><h3>월별 업무분류 추이</h3><div style="overflow-x:auto">${svg}</div>
      <div class="legend">${[...CATS,"미분류"].map((c,i)=>`<span><i class="dot" style="background:${CAT_COLOR[[...CATS,""][i]]}"></i>${c}</span>`).join("")}</div></div>
    <div class="card" style="grid-column:1/-1"><h3>연차 현황 <span class="muted small">(${p==="all"?String(new Date().getFullYear()):p.slice(0,4)}년 · 자세한 건 연차 관리 탭)</span></h3>
      ${leaveKpis(p==="all"?String(new Date().getFullYear()):p.slice(0,4))}${leaveMonthly(p==="all"?String(new Date().getFullYear()):p.slice(0,4))}</div>
    <div class="card"><h3>진행상황별</h3>${hbars(stList,tot)}</div>
    <div class="card"><h3>분류 × 상태</h3><div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>분류</th>${STATUSES.map(s=>`<th class="num">${s}</th>`).join("")}</tr></thead><tbody>
      ${[...CATS,""].map(c=>`<tr><td>${c||"미분류"}</td>${STATUSES.map(s=>`<td class="num">${ts.filter(t=>(t.cat||"")===c&&t.status===s).length||"–"}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
   </div></section>`;
  $("#sp").onchange=e=>{S.statPeriod=e.target.value;render();}; $("#snooff").onchange=e=>{S.statNoOff=e.target.checked;render();};
}

/* 5. progress */
function rProgress(){
  const p=S.progPeriod, today=todayStr();
  const base=all().filter(t=>!isOff(t));
  const scoped=base.filter(t=>inPeriod(t,p));
  const cols=STATUSES.map(s=>{ const list=(["예정","진행중","보류"].includes(s)?base:scoped).filter(t=>t.status===s).sort((a,b)=>(s==="완료"||s==="취소")?(b.start||"").localeCompare(a.start||""):(a.start||"9").localeCompare(b.start||"9")); return [s,list]; });
  const segTotal=scoped.length;
  const seg=STATUSES.map(s=>[s,scoped.filter(t=>t.status===s).length]);
  const up=base.filter(t=>t.status!=="완료"&&t.status!=="취소").sort((a,b)=>(a.start||"9").localeCompare(b.start||"9"));
  // release pipeline
  const rel={}; base.forEach(t=>{ const m=/(?:v)?(1\.\d{2})(?!\.\d)/.exec(t.name); if(m && /QA|스프린트|라이브|LIVE|live|배포|킥오프/.test(t.name)) (rel[m[1]] ||= []).push(t); });
  const relKeys=Object.keys(rel).sort((a,b)=>Number(b.split(".")[1])-Number(a.split(".")[1]));
  const dd=s=>{ if(!s) return "–"; const n=Math.round((pd(s)-pd(today))/864e5); return n===0?"D-day":n>0?"D-"+n:"D+"+(-n); };
  $("#view").innerHTML=`<section class="sheet">
   <div class="sheet-head"><h2>업무 진행현황</h2>
    <select class="inp" id="pp"><option value="all">전체 기간</option>${months().map(k=>`<option value="${k}" ${p===k?"selected":""}>${k.replace("-","년 ")}월</option>`).join("")}</select></div>
   <div style="margin-bottom:16px"><div class="bar" style="height:14px">${seg.map(([s,n])=>n?`<i style="width:${n/segTotal*100}%;background:${ST_COLOR[s]}" title="${s} ${n}건"></i>`:"").join("")}</div>
    <div class="legend" style="margin-top:6px">${seg.map(([s,n])=>`<span><i class="dot" style="background:${ST_COLOR[s]}"></i>${s} ${n}</span>`).join("")}<span>· 휴무 제외 ${segTotal}건</span></div></div>
   <div class="grid2" style="margin-bottom:16px">
    <div class="card"><h3>남은 일 · D-day</h3><div class="uplist">${up.length?up.map(t=>`<div class="clk" data-open="${t.id}" role="button" tabindex="0"><span class="dday">${dd(t.start)}</span><span class="chip" style="color:${ST_COLOR[t.status]}">${ST_ICON[t.status]} ${t.status}</span><span>${esc(t.name)}</span><span class="muted small" style="margin-left:auto">${md(t.start)}</span></div>`).join(""):`<p class="muted">남은 업무가 없어요.</p>`}</div></div>
    <div class="card"><h3>릴리즈별 QA 단계</h3><div class="pipe">${relKeys.map(k=>`<div class="pipe-row"><span class="v">v${k}</span><div class="steps">${rel[k].sort((a,b)=>(a.start||"").localeCompare(b.start||"")).map(t=>`<span class="step clk ${t.status==="완료"?"ok":t.status==="취소"?"x":"plan"}" data-open="${t.id}" role="button" tabindex="0" title="${esc(t.name)}">${ST_ICON[t.status]} ${esc(cleanName(t).replace(/^v?1\.\d{2}\s*/,"").slice(0,18))} <span class="muted">${md(t.start)}</span></span>`).join("")}</div></div>`).join("")}</div></div>
   </div>
   <p class="muted small" style="margin:0 0 8px">예정·진행중·보류는 기간과 상관없이 모두, 완료·취소는 선택한 기간만 보여요. 카드의 상태를 바꾸면 업무DB에 바로 반영돼요.</p>
   <div class="board">${cols.map(([s,list])=>`<div class="col" data-col="${s}"><h4><span style="color:${ST_COLOR[s]}">${ST_ICON[s]} ${s}</span><span class="muted">${list.length}</span></h4><div class="list">
     ${list.map(t=>`<div class="kcard clk s-${t.status}" data-open="${t.id}" role="button" tabindex="0" style="border-left-color:${CAT_COLOR[t.cat]||CAT_COLOR[""]}"><span>${esc(t.name)}</span><div class="meta"><span>${t.start?md(t.start):"날짜 없음"}${t.end?" → "+md(t.end):""} · ${esc(t.cat||"미분류")}</span>
       <select data-st="${t.id}" aria-label="진행상황">${STATUSES.map(x=>`<option ${x===t.status?"selected":""}>${x}</option>`).join("")}</select></div></div>`).join("")||`<span class="muted small">없음</span>`}
   </div></div>`).join("")}</div>
  </section>`;
  $("#pp").onchange=e=>{S.progPeriod=e.target.value;render();};
  let kd=null; const colEls=[...$("#view").querySelectorAll(".col[data-col]")];
  $("#view").querySelectorAll(".kcard[data-open]").forEach(c=>{
    c.draggable=true;
    c.ondragstart=e=>{ if(e.target.closest("select")){ e.preventDefault(); return; } kd=c.dataset.open; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",kd); }catch{} c.classList.add("dragging"); };
    c.ondragend=()=>{ c.classList.remove("dragging"); colEls.forEach(x=>x.classList.remove("col-drop")); kd=null; };
  });
  colEls.forEach(col=>{
    col.ondragover=e=>{ if(!kd) return; e.preventDefault(); e.dataTransfer.dropEffect="move"; colEls.forEach(x=>x!==col&&x.classList.remove("col-drop")); col.classList.add("col-drop"); };
    col.ondragleave=e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove("col-drop"); };
    col.ondrop=e=>{ e.preventDefault(); col.classList.remove("col-drop"); const t=kd&&findTask(kd); kd=null; const s=col.dataset.col;
      if(!t||t.status===s) return; upsertTask({...t,status:s}); render(); toast(`'${cleanName(t)}' → ${s}`); };
  });
  $("#view").querySelectorAll("[data-open]").forEach(el=>{ const open=e=>{ if(e.target.closest("select")) return; const t=findTask(el.dataset.open); if(t) taskForm(t); };
    el.onclick=open; el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(e); } }; });
  $("#view").querySelectorAll("[data-st]").forEach(s=>s.onchange=()=>{ const t=findTask(s.dataset.st); upsertTask({...t,status:s.value}); render(); toast(`'${cleanName(t)}' → ${s.value}`); });
}

function fbReport(k){
  const [y,m]=k.split("-"), fb=S.feedback.months[k]||{};
  const lines=[`[${y}년 ${Number(m)}월 월별 피드백]`];

/* ---------- sticky-note memos (shown on every tab) ---------- */
const MEMO_COLORS=[["#fff1a8","노랑"],["#ffd3df","분홍"],["#cde6ff","하늘"],["#d6f0c6","연두"],["#e4d8ff","라벤더"]];
let memoTimer=null, memoDirty=false, memoPal=null, memoArmed=null, memoDrag=null;
function saveMemosSoon(now){ clearTimeout(memoTimer); const go=()=>persist("settings","memos",{list:S.memos}); if(now) go(); else memoTimer=setTimeout(go,600); }
function memoInk(hex){ const m=/^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#2b2a26"; const n=parseInt(m[1],16), r=n>>16&255, g=n>>8&255, b=n&255; return (0.299*r+0.587*g+0.114*b)>150?"#2b2a26":"#ffffff"; }
function memoEditing(){ const a=document.activeElement; return a && a.closest && a.closest("#memos") && (a.tagName==="TEXTAREA"||a.tagName==="INPUT"); }
function renderMemos(force){
  if(!force && memoEditing()){ memoDirty=true; return; }
  const box=$("#memos"); if(!box) return;
  $("#memo-count").textContent=S.memos.length?`${S.memos.length}개`:"";
  if(!S.memos.length){ box.innerHTML=`<div class="memo-empty">중요한 일정이나 오래 보고 있어야 할 내용을 붙여 두세요.<br>모든 탭에서 계속 보여요.</div>`; return; }
  box.innerHTML=S.memos.map(m=>`<div class="memo ${m.folded?"folded":""}" data-mid="${m.id}" style="--mc:${esc(m.color)};--mink:${memoInk(m.color)}">
    <div class="memo-bar" title="끌어서 순서 바꾸기"><span class="memo-grip" aria-hidden="true">⠿</span><span class="memo-date">${m.at?md(m.at):""}</span>
      <button class="memo-btn" data-mpal="${m.id}" title="색 바꾸기" aria-label="메모 색 바꾸기"><i class="memo-dot"></i></button>
      <button class="memo-btn ${memoArmed===m.id?"armed":""}" data-mdel="${m.id}" title="메모 삭제" aria-label="메모 삭제">${memoArmed===m.id?"삭제?":"×"}</button></div>
    <input class="memo-title" data-mtitle value="${esc(m.title||"")}" placeholder="${m.folded&&!m.title?esc((m.text||"").split("\n")[0].slice(0,30)||"제목 없음"):"제목"}" aria-label="메모 제목">
    ${memoPal===m.id&&!m.folded?`<div class="memo-pal">${MEMO_COLORS.map(([c,n])=>`<button style="background:${c}" class="${c===m.color?"on":""}" data-mcolor="${c}" title="${n}" aria-label="${n}"></button>`).join("")}<label>직접<input type="color" data-mcustom value="${esc(/^#[0-9a-f]{6}$/i.test(m.color)?m.color:"#fff1a8")}" aria-label="색 직접 고르기"></label></div>`:""}
    ${m.folded?"":`<textarea data-mtext rows="2" placeholder="메모를 적으세요">${esc(m.text||"")}</textarea>`}
    <button class="memo-fold" data-mfold="${m.id}" title="${m.folded?"펼치기":"접기"}" aria-label="${m.folded?"메모 펼치기":"메모 접기"}" aria-expanded="${!m.folded}"></button></div>`).join("");
  box.querySelectorAll(".memo").forEach(el=>{
    const m=S.memos.find(x=>x.id===el.dataset.mid); if(!m) return;
    const onBlur=()=>{ saveMemosSoon(true); if(memoDirty){ memoDirty=false; setTimeout(()=>{ if(!memoEditing()) renderMemos(); },0); } };
    const ta=el.querySelector("textarea[data-mtext]");
    if(ta){ const fit=()=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }; fit();
      ta.oninput=()=>{ m.text=ta.value; fit(); saveMemosSoon(); }; ta.onblur=onBlur; }
    const ti=el.querySelector("[data-mtitle]");
    ti.oninput=()=>{ m.title=ti.value; saveMemosSoon(); }; ti.onblur=onBlur;
    ti.onkeydown=e=>{ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); if(ta) ta.focus(); } };
    el.querySelector("[data-mfold]").onclick=()=>{ m.folded=!m.folded; if(!m.folded) delete m.folded; memoPal=null; saveMemosSoon(true); renderMemos(true); };
    el.querySelector("[data-mpal]").onclick=()=>{ memoPal=memoPal===m.id?null:m.id; memoArmed=null; renderMemos(true); };
    const del=el.querySelector("[data-mdel]");
    del.onclick=()=>{ if(memoArmed===m.id){ S.memos=S.memos.filter(x=>x.id!==m.id); memoArmed=null; saveMemosSoon(true); renderMemos(true); toast("메모를 지웠어요."); }
      else { memoArmed=m.id; renderMemos(true); setTimeout(()=>{ if(memoArmed===m.id){ memoArmed=null; renderMemos(); } },3000); } };
    el.querySelectorAll("[data-mcolor]").forEach(b=>b.onclick=()=>{ m.color=b.dataset.mcolor; ls.set("wd-memo-color",m.color); saveMemosSoon(true); renderMemos(true); });
    // drag to reorder: grab the top strip of the note
    const bar=el.querySelector(".memo-bar");
    bar.onmousedown=e=>{ if(!e.target.closest("button")) el.draggable=true; };
    el.onmouseup=()=>{ el.draggable=false; };
    el.ondragstart=e=>{ memoDrag=m.id; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",m.id); }catch{} el.classList.add("dragging"); };
    el.ondragend=()=>{ el.draggable=false; el.classList.remove("dragging"); box.querySelectorAll(".memo").forEach(x=>x.classList.remove("drop-above","drop-below")); memoDrag=null; };
    el.ondragover=e=>{ if(!memoDrag||memoDrag===m.id) return; e.preventDefault(); const r=el.getBoundingClientRect(), below=e.clientY>r.top+r.height/2; el.classList.toggle("drop-below",below); el.classList.toggle("drop-above",!below); };
    el.ondragleave=e=>{ if(!el.contains(e.relatedTarget)) el.classList.remove("drop-above","drop-below"); };
    el.ondrop=e=>{ e.preventDefault(); el.classList.remove("drop-above","drop-below"); const from=memoDrag; memoDrag=null; if(!from||from===m.id) return;
      const r=el.getBoundingClientRect(), below=e.clientY>r.top+r.height/2, moving=S.memos.find(x=>x.id===from);
      const rest=S.memos.filter(x=>x.id!==from), ti=rest.findIndex(x=>x.id===m.id); rest.splice(below?ti+1:ti,0,moving);
      S.memos=rest; saveMemosSoon(true); renderMemos(true); };
    const cu=el.querySelector("[data-mcustom]"); if(cu){ cu.oninput=()=>{ el.style.setProperty("--mc",cu.value); el.style.setProperty("--mink",memoInk(cu.value)); }; cu.onchange=()=>{ m.color=cu.value; ls.set("wd-memo-color",m.color); saveMemosSoon(true); renderMemos(true); }; }
  });
}
$("#memo-add").onclick=()=>{
  const m={id:"m"+Date.now().toString(36),text:"",color:ls.get("wd-memo-color")||MEMO_COLORS[0][0],at:todayStr()};
  S.memos.unshift(m); memoPal=null; saveMemosSoon(true); renderMemos(true);
  const ti=$(`.memo[data-mid="${m.id}"] [data-mtitle]`); if(ti) ti.focus();
};

    ...tasks.map(t=>[t.name,t.start,t.end,t.time,t.owner,t.cat||"미분류",t.place,t.status,t.hist?"Yes":"",t.rec?ruleLabel(ruleOf(t.rec)||{dows:[],freq:"weekly"}):"",t.desc||""])],[46,11,11,12,12,10,14,8,8,18,60]);
  const CHK_TXT={todo:"할 일",done:"완료",moved:"이월",cancel:"취소"};
  const wrows=[["주 시작일","날짜","요일","날짜 메모","상태","할 일","비고","유관자"]], nrows=[["주 시작일","주 메모","프리노트"]];
  Object.keys(S.weeks).sort().forEach(k=>{ const w=S.weeks[k], mon=pd(k);
    w.days.slice(0,5).forEach((d,i)=>{ const dt=addDays(mon,i), ds=ymd(dt);
      if(!d.items.length && d.memo) wrows.push([k,ds,DOW[dt.getDay()],d.memo,"","",""]);
      d.items.forEach((it,j)=>wrows.push([k,ds,DOW[dt.getDay()],j===0?d.memo:"",CHK_TXT[it.s]||it.s,(it.lv?"    └ ":"")+it.t,it.n||"",(it.who||[]).join(", ")])); });
    if(w.top||w.note) nrows.push([k,w.top||"",w.note||""]); });
  add("주간다이어리",wrows,[11,11,5,22,7,50,16]);
  add("주간 프리노트",nrows,[11,24,90]);
  add("월별피드백",[["월",...FB_FIELDS.map(f=>f[1])],...Object.keys(S.feedback.months||{}).sort().map(k=>{ const f=S.feedback.months[k]; return [k,...FB_FIELDS.map(([x])=>f[x]||"")]; })],[9,40,50,40,40,50]);
  add("연차 사용",[["날짜","종류","차감 일수","메모"],...Object.entries(S.leave.uses).sort().map(([d,v])=>[d,v.type,Number(v.days)||0,v.memo||""])],[11,10,10,24]);
  add("연차 부여",[["날짜","일수","메모"],...S.leave.grants.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(g=>[g.date,Number(g.days)||0,g.memo||""])],[11,8,30]);
  add("공휴일",[["날짜","이름"],...Object.entries(S.holidays).sort()],[11,16]);
  add("반복일정",[["이름","반복","시작일","종료일","시간","업무분류","장소"],...S.rules.map(r=>[r.name,ruleLabel(r),r.start,r.until||"",r.time||"",r.cat||"",r.place||""])],[36,20,11,11,8,10,10]);
  return XLSX.write(wb,{type:"array",bookType:"xlsx"});
}
$("#btn-backup").onclick=async()=>{
  if(!window.XLSX) return toast("엑셀 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.");
  try{ saveFile(`업무다이어리_백업_${todayStr().replaceAll("-","")}.xlsx`,new Blob([buildBackup()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})); toast("백업 파일을 내려받았어요."); }
  catch(e){ toast("백업 파일을 만들지 못했어요."); }
};

/* ---------- boot ---------- */
try{ const t=localStorage.getItem("wd-tab"); if(t&&TABS.some(x=>x[0]===t)) S.tab=t; }catch{}
let started=false;
function startApp(){
  showApp();
  if(started){ db.pull(); return; }
  started=true; boot();
}
async function boot(){
  if(PREVIEW){
    if(!db) db=await artifactDB();
    $("#banner").innerHTML=`<div class="banner preview-band">미리보기 화면이에요. 여기서 고친 내용은 실제 다이어리(Netlify·구글 시트)에 저장되지 않아요.</div>`;
    $("#sync-state").textContent="미리보기 저장소";
    if(!db){ $("#banner").innerHTML+=`<div class="banner">저장소에 연결하지 못했어요. claude.ai에 로그인한 상태로 다시 열어 주세요.</div>`; return; }
  } else db=SheetDB();
  db.collection("tasks").onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{ next[d.id]={items:JSON.parse(JSON.stringify(d.data().items||[]))}; });
    S.tasks=next; ALL=null;
    softRender();
  },()=>{});
  db.collection("settings").doc("categories").onSnapshot(s=>{ if(s.exists&&Array.isArray(s.data().list)&&s.data().list.length) applyCats(s.data().list); softRender(); },()=>{});
  db.collection("settings").doc("memos").onSnapshot(s=>{ if(memoEditing()){ memoDirty=true; return; } S.memos=s.exists?JSON.parse(JSON.stringify(s.data().list||[])):[]; renderMemos(); },()=>{});
  db.collection("settings").doc("symbols").onSnapshot(s=>{ if(s.exists&&Array.isArray(s.data().list)) S.symbols=[...s.data().list]; softRender(); },()=>{});
  db.collection("settings").doc("people").onSnapshot(s=>{ S.people=s.exists?JSON.parse(JSON.stringify(s.data().list||[])):[]; if(!$("#pop")) softRender(); },()=>{});
  db.collection("settings").doc("recurring").onSnapshot(s=>{ S.rules=s.exists?JSON.parse(JSON.stringify(s.data().rules||[])):[]; ALL=null; softRender(); },()=>{});
  db.collection("settings").doc("leave").onSnapshot(s=>{ if(s.exists&&!(S.tab==="leave"&&editingInView())){ const v=JSON.parse(JSON.stringify(s.data())); S.leave={grants:v.grants||[],uses:v.uses||{}}; } softRender(); },()=>{});
  db.collection("settings").doc("holidays").onSnapshot(s=>{ S.holidays=s.exists?{...(s.data().days||{})}:{}; softRender(); },()=>{});
  db.collection("weeks").onSnapshot(snap=>{ snap.docs.forEach(d=>{ if(d.id!==weekKey()||(!editingInView()&&!$("#pop"))) S.weeks[d.id]=JSON.parse(JSON.stringify(d.data())); }); softRender(); },()=>{});
  db.collection("feedback").doc("all").onSnapshot(s=>{ if(s.exists && !(S.tab==="feedback"&&editingInView())) S.feedback=JSON.parse(JSON.stringify(s.data())); if(!S.feedback.months) S.feedback.months={}; softRender(); },()=>{});
}
gateUrlUI(false);
{ const saved=ss.get("wd-code")||ls.get("wd-code");
  if(PREVIEW){ if(saved) previewCheck(saved).then(ok=>{ if(ok){ CODE=saved; startApp(); } else $("#gate-code").focus(); }); else $("#gate-code").focus(); }
  else if(saved&&apiUrl()){ CODE=saved; startApp(); } else $(apiUrl()?"#gate-code":"#gate-url").focus(); }
})();
</script>
